<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MultiList App</title>
    <style>
      .button {
         background: #dddddd;
         border-left-color: #eeeeee;
         border-top-color: #eeeeee;
         border-right-color: #cccccc;
         border-bottom-color: #cccccc;
         border-width: 1px;
         border-style:solid;
         margin: 5px;
      }
      .button:hover {
         background: #ddddee;
         border-left-color: #eeeeee;
         border-top-color: #eeeeee;
         border-right-color: #cccccc;
         border-bottom-color: #cccccc;
         border-width: 2px;
         border-style:solid;
         margin: 4px;
      }
      .button:active {
         border-left-color: #cccccc;
         border-top-color: #cccccc;
         border-right-color: #eeeeee;
         border-bottom-color: #eeeeee;
      }
      .editBtn::after {
        content:"\270f";
      }
      .delBtn {
        position:absolute;
        right: 10px;
      }
      .delBtn::after {
        content:"\274c";
      }
      .addBtn {
      }
      .addBtn::after {
        content:"\2795";
      }

      .lists {
        display:flex;
        flex-direction:column;
        list-style-position:inside;
        padding:0px;
        margin:0px;
      }
      .listEntry {
        border:solid;
        border-width:1px;
        margin: 4px;
        background:#eeeeff;
        order:1000000;
      }
      .listEntry::marker {
        content:none;
      }

      .soon {
        display:flex;
        flex-direction:column;
        padding:5px;
        margin:0;
      }
      .soonEntry {
        background:#ffcccc;
        margin:1px;
        order:1000000;
      }
      .soonEntry::marker {
        content:none;
      }
      .items {
        display:flex;
        flex-direction:column;
        padding:5px;
      }
      .itemEntry::marker {
        content:none;
      }
      .editField {
         background: #ffffff;
         border-left-color: #cccccc;
         border-top-color: #cccccc;
         border-right-color: #eeeeee;
         border-bottom-color: #eeeeee;
         border-width: 1px;
         border-style:solid;
         margin: 5px;
         resize:horizontal;
         overflow:hidden;
         display:inline-block;
      }
    </style>
  </head>
  <body>
    <script src="jquery.js"></script>
    <script>
      <!-- set the order of an list item using flex -->
      function setOrderFromPrio( listId, prio)
      {
        var s=undefined;
        if( !isNaN(prio))
        {
          // prio is a number. Set as flex-order.
          s='order:'+prio+';';
        }
        $( '#'+ listId).attr('style',s);
      }
      <!-- Function to make display items editable -->
      function linkEditBtn( suffix, varName, fieldId, btnId, callback) {
        $( '#' + btnId).click( function() {
          if( $( '#' + fieldId).attr('contenteditable') === undefined) {
            $( '#' + fieldId).attr('contenteditable','true').addClass('editField');
          } else {
            var text=$( '#' + fieldId).removeAttr('contenteditable').removeClass('editField').text();
            data = {};
            data[varName]=text;
            if( callback !== undefined) {
              console.log( 'linkEditBtn callback');
              callback( text);
            }
            $.ajax({ url: "/" + suffix, type: "PUT", contentType:"application/json", data:JSON.stringify(data)}).done(function(json) {
            });
          }
        })
      }
      <!-- Refresh all lists -->
      function refreshLists( ) {
        $.ajax({ url: "/lists", type: "GET", dataType:"json"}).done(function(json) {
          $( "#lists").empty();
          $.each( json, function(index,listId) {
            <!-- Create the list as a DOM list item -->
            $( "<li class='listEntry' id='" + listId + "'>" +
                  "<div class='listHeader' id='" + listId + "'>" +
                    "<span class='button delBtn' id='del-" + listId + "'></span>" +
                    "<span class='listName' id='ln-" + listId + "'></span>" +
                    "<span class='button editBtn' id='eln-" + listId + "'></span>" +
                    "<span class='period' id='wp-" + listId + "'></span>" +
                    "<span class='button editBtn' id='ewp-" + listId + "'></span>" +
                    "<span class='period' id='prio-" + listId + "'></span>" +
                    "<span class='button editBtn' id='eprio-" + listId + "'></span>" +
                    "<span class='button addBtn' id='ai-" + listId + "'></span>" +
                  "</div>" +
                  "<ul class='items' id='it-" + listId + "'></ul>" +
               "</li>"
            ).appendTo( "#lists");
            <!-- Populate the properties -->
            $.ajax({ url: '/list/' + listId, type: "GET", dataType:"json"}).done(function(json) {
              $( '#ln-' + listId).text( json['name']);
              $( '#wp-' + listId).text( json['warning_period']);
              let prio=json['priority'];
              $( '#prio-' + listId).text( prio);
              setOrderFromPrio( listId, prio);
            });
            <!-- Make properties editable -->
            linkEditBtn( 'list/' + listId, 'name', 'ln-' + listId, 'eln-' + listId);
            linkEditBtn( 'list/' + listId, 'priority', 'prio-' + listId, 'eprio-' + listId, function(value) {setOrderFromPrio(listId,value);});
            linkEditBtn( 'list/' + listId, 'warning_period', 'wp-' + listId, 'ewp-' + listId);
            <!-- Delete list button -->
            $( '#del-' + listId).click(function() {
              if( confirm( "Delete list?")) {
                $.ajax({ url: '/list/' + listId, type: "DELETE"}).done(function(json) {
                  if( json === true) {
                    refreshLists();
                  } else {
                    alert( "Only empty lists can be deleted.")
                  }
                });
              }
            });
            <!-- Populate the list items -->
            $.ajax({ url: "/items/"+ listId, type: "GET", dataType:"json"}).done(function(items) {
              listDom = $( "it-" + listId).empty();
              $.each(items,function(itemInd, itemId) {
                let uId=listId+'-'+itemId;
                <!-- Create the item as a dom list item -->
                $( "<li class='itemEntry' id='" + uId + "'>"+
                    "<div class='itemHeader' id='" + uId + "'>" +
                      "<span class='button delBtn' id='del-" + uId + "'></span>" +
                      "<span class='itemSubject' id='is-" + uId + "'></span>" +
                      "<span class='button editBtn' id='eis-" + uId + "'></span>" +
                      "<span class='date' id='exp-" + uId + "'></span>" +
                      "<span class='button editBtn' id='eexp-" + uId + "'></span>" +
                      "<span class='priority' id='prio-" + uId + "'></span>" +
                      "<span class='button editBtn' id='eprio-" + uId + "'></span>" +
                      "<span class='status' id='status-" + uId + "'></span>" +
                      "<span class='button editBtn' id='estatus-" + uId + "'></span>" +
                    "</div>" +
                    "<div class='itemBody' id=ib-'" + uId + "'>" +
                      "<span class='itemDesc' id='desc-" + uId + "'></span>" +
                      "<span class='button editBtn' id='edesc-" + uId + "'></span>" +
                    "</div>" +
                   "</li>").appendTo( "#it-" + listId);
                <!-- Populate the item -->
                $.ajax({ url: "/item/"+ listId+ "/" + itemId, type: "GET", dataType:"json"}).done(function(itemProp) {
                  console.log(itemProp);
                  $( '#is-' + uId).text( itemProp['subject']);
                  $( '#exp-' + uId).text( itemProp['expires']);
                  $( '#status-' + uId).text( itemProp['status']);
                  $( '#desc-' + uId).text( itemProp['details']);
                  var prio=itemProp['priority'];
                  $( '#prio-' + uId).text( prio);
                  setOrderFromPrio( uId, prio);
                });
                <!-- Link the edit buttons -->
                linkEditBtn( 'item/' + listId + '/' + itemId, 'subject', 'is-' + uId, 'eis-' + uId);
                linkEditBtn( 'item/' + listId + '/' + itemId, 'expires', 'exp-' + uId, 'eexp-' + uId);
                linkEditBtn( 'item/' + listId + '/' + itemId, 'priority', 'prio-' + uId, 'eprio-' + uId, function(value) {setOrderFromPrio(uId,value);});
                linkEditBtn( 'item/' + listId + '/' + itemId, 'status', 'status-' + uId, 'estatus-' + uId);
                linkEditBtn( 'item/' + listId + '/' + itemId, 'details', 'desc-' + uId, 'edesc-' + uId);
                <!-- Delete item button -->
                $( '#del-' + uId).click(function() {
                  if( confirm( "Delete item?")) {
                    $.ajax({ url: '/item/' + listId + '/' + itemId, type: "DELETE"}).done(function(json) {
                      refreshLists();
                    });
                  }
                });
              });
            });
            <!-- Handle add items clicks -->
            $( "#ai-" + listId).click(function() {
              $.ajax({ url: "/items/" + listId, type: "POST"}).done(function(items) {
                refreshLists();
              });
            });
          });
        })
      }

      <!-- Load the initial list -->
      $( document ).ready(function() {
        refreshLists();
        $( "#addList").click(function() {
          $.ajax({ url: "/lists", type: "POST", dataType:"json"}).done(function(items) {
            refreshLists();
          });
        });
      });
    </script>
    <ul class='soon' id='soon'>
    </ul>
    <span id="addList" class="button addBtn"></span>
    <ul class='lists' id="lists">
    </ul>
  </body>
</html>
