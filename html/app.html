<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MultiList App</title>
    <link rel="stylesheet" href="jquery-ui.css">
    <style>
      .topBar {
        display:flex;
        flex-direction:row;
      }
      .syncStatus {
        width:64px;
      }
      .soon {
        padding:0;
        margin:0;
        margin-bottom:1em;
        background:black;
        width:100%;
      }
      .soonEntry {
        background:white;
        display:flex;
        flex-direction: row;
        margin-bottom: 2px;
      }
      .soonEntry::marker {
        content:none;
      }
      .soonTimePref {
        margin-right: 1em;
        width: 15%;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .soonTimePrefInner {
      }
      .soonTimeComing {
        background: yellow;
        color:black;
      }
      .soonTimeOverdue {
        background: black;
        color:yellow;
      }
      .soonEntryInfo {
        display: flex;
        flex-direction: column;
        width:100%;
      }
      .soonEntrySubj {
        display: flex;
        flex-direction: row;
      }
      .soonEntryListName {

      }
      .soonEntrySubjTxt {

      }
      .soonEntryDescBox {
        background: #eee;
        width:100%;
      }
      .soonEntryDesc {
        font-family: serif;
      }


      .labelLeft {
        margin-left: 1em;
        margin-right: 0.5em;
      }
      .labelRight {
        margin-left: 0.5em;
        margin-right: 1em;
      }

      .lists {
        padding:0;
        display:flex;
        flex-direction:column;
      }

      .listEntry {
        display: flex;
        flex-direction: column;
        margin-bottom:2em;
        background:#eee;
      }
      .listEntry::marker {
        content:none;
      }

      .listHeader {
        display: flex;
        flex-direction: row;
        align-items: center;
      }

      .optHeader {
        display: flex;
        flex-direction: row;
        align-items: center;
      }
      .hiddenOptHeader {
        display: none;
      }

      .inputField {
        width:100%;
      }
      .inputFieldTab {
        width:5em;
      }
      .warnField {
        width: 2em;
      }
      .prioField {
        width:5em;
      }

      .listOptions {
      }

      .listOptionCheck {
        margin-left: 2em;
      }

      .items {
         padding-left: 0.5em;
         background-color:white;
         display:flex;
         flex-direction:column;
      }
      .itemEntry {
        display:flex;
        flex-direction:column;
        margin-bottom:0.5em;
      }
      .itemEntry::marker {
        content:none;
      }
      .itemHeader {
        display:flex;
        flex-direction:row;
        align-items: center;
      }
      .itemInputField {
        width:100%;
      }
      .itemDateField {
        width:7em;
      }
      .itemPrioField {
        width:6em;
      }
      .itemStatusField {
        width:6em;
      }
      .tabHeader {
        display:flex;
      }
      .thiFirst {
        order:-1000000;
      }
      .thiLast {
        order:1000000;
      }
    </style>
  </head>
  <body>
    <script src="jquery.js"></script>
    <script src="jquery-ui.js"></script>
    <script>
      <!-- Compute milliseconds from a simplified ISO period string -->
      function computeMsOfPeriod(periodString) {
        const periodRegex = /^(\d+)([dwm])$/i;
        const periodMatch = periodRegex.exec(periodString);
        if( periodMatch !== null) {
          var days = parseInt(periodMatch[1]);
          if (periodMatch[2].toLowerCase() == 'w') {
            days = days * 7;
          } else if( periodMatch[2].toLowerCase() == 'm') {
            days = days * 30;
          }
          return days * 24 * 3600 * 1000;
        } else {
          return undefined;
        }
      }
      <!-- set the order of an list item using flex -->
      function setOrderFromPrio( listId, prio)
      {
        var s=undefined;
        if( !isNaN(prio))
        {
          // prio is a number. Set as flex-order.
          s='order:'+prio+';';
        }
        $( '#'+ listId).attr('style',s);
      }
      <!-- Function to make display items editable -->
      function linkEditBtn( suffix, varName, fieldId, btnId, callback) {
        $( '#' + btnId).click( function() {
          if( $( '#' + fieldId).attr('contenteditable') === undefined) {
            $( '#' + fieldId).attr('contenteditable','true').addClass('editField');
          } else {
            var text=$( '#' + fieldId).removeAttr('contenteditable').removeClass('editField').text();
            data = {};
            data[varName]=text;
            if( callback !== undefined) {
              callback( text);
            }
            $.ajax({ url: "/" + suffix, type: "PUT", contentType:"application/json", data:JSON.stringify(data)}).done(function(json) { });
          }
        })
      }
      <!-- Function to make display items editable -->
      function linkInput( suffix, varName, fieldId, inputId, callback) {
        $( '#' + fieldId).click( function() {
          $( '#' + fieldId).addClass("hidden");
          $( '#' + inputId).removeClass("hidden").on( "change", function() {
            var text=$( '#' + inputId).addClass("hidden").val();
            $( '#' + fieldId).removeClass("hidden").text(text);
            data = {};
            data[varName]=text;
            if( callback !== undefined) {
              callback( text);
            }
            $.ajax({ url: "/" + suffix, type: "PUT", contentType:"application/json", data:JSON.stringify(data)}).done(function(json) { });
          }).on( "blur", function() {
            var text=$( '#' + fieldId).removeClass("hidden").text();
            $( '#' + inputId).addClass("hidden").val(text);
          });
        });
      }
      <!-- Function to make inputs react to input -->
      function linkInputDirect( suffix, varName, inputId, callback, eventName='change') {
        $( '#' + inputId).on( eventName, function() {
          var text=$( '#' + inputId).val();
          data = {};
          data[varName]=text;
          if( callback !== undefined) {
            callback( text);
          }
          $.ajax({ url: "/" + suffix, type: "PUT", contentType:"application/json", data:JSON.stringify(data)}).done(function(json) { });
        });
      }
      function linkCheckboxDirect( suffix, varName, inputId) {
        $( '#' + inputId).on( "change", function() {
          var checked=$( '#' + inputId).prop( 'checked');
          data = {};
          data[varName]=checked;
          $.ajax({ url: "/" + suffix, type: "PUT", contentType:"application/json", data:JSON.stringify(data)}).done(function(json) { });
        });
      }
      <!-- Display time left -->
      function formatTimeLeft( newTs, oldTs, suffix)
      {
        var days = Math.round( (newTs - oldTs) / 1000 / 3600 / 24);
        return days + " days " + suffix;
      }
      <!-- Connect a show-hide button to its content -->
      function connectShowHideButton(btnId, contentId, uId, reloadOnClose=false)
      {
        $( '#' + btnId + '-' + uId).on( 'click', function() {
          var descObj = $('#' + contentId + '-' + uId);
          var btnObj = $('#' + btnId + '-' + uId);
          if( descObj.prop('hidden')) {
            <!-- Textarea hidden -> reveal -->
            descObj.removeAttr('hidden');
            btnObj.button( {icon: 'ui-icon-triangle-1-s'});
          } else {
            <!-- Textarea visible -> hide -->
            descObj.attr('hidden',"");
            btnObj.button( {icon: 'ui-icon-triangle-1-e'});
            if( reloadOnClose)
            {
              refreshLists();
            }
          }
        });
      }
      <!-- Convert an undefined value to true. Convert everything to a correspoding bool.  -->
      function undefinedToTrue(val)
      {
        return (val == undefined) || (!!val);
      }
      // Hide a span if the option is off
      function hideOptionalSpan( idPref, uId, opt) {
        if( !opt) {
          $( '#' + idPref + '-' + uId).removeClass('optHeader').addClass('hiddenOptHeader');
        }
      }
      // Refresh all lists
      function refreshLists( ) {
        $.ajax({ url: "/lists", type: "GET", dataType:"json"}).done(function(json) {
          $( "#soon").empty();
          // Prepare the default tabs. This will clean #lists automatically.
          // However, the tabs object must be destroyed first on refresh, thus
          // it will be created after loading the doc, then destroyed, then created again.
          $( '#tabs').tabs('destroy').empty().append(
            "<ul id='tabheader' class='tabHeader'>" +
              "<li id='thi-start' class='thiFirst'><a href='#tab-start'>Start</a></li>" +
            "</ul>" +
            "<div id='tab-start'>" +
              "<ul class='lists' id='lists'>" +
              "</ul>" +
            "</div>"
            );

          $.each( json, function(index,listId) {
            var listName;
            var listPrio;
            var warning_period = '';
            var optShow;
            var optExp;
            var optPrio;
            var optStatus;
            <!-- Populate the properties. Do it synchronously to simplify getting the warning period.-->
            $.ajax({ url: '/list/' + listId, type: "GET", dataType:"json", async:false}).done(function(json) {
              listName = json['name']
              warning_period = json['warning_period'];
              listPrio=json['priority'];

              optShow = json['optShow'] || "front" ;
              optExp = undefinedToTrue(json['optExp']);
              optPrio = undefinedToTrue(json['optPrio']);
              optStatus = undefinedToTrue(json['optStatus']);

            });
            // Create the list as a DOM list item

            var listHtml = 
                "<span class='listHeader' id='" + listId + "'>" +
                  "<input class='inputField' id='eln-" + listId + "'>" +
                  "<span class='optHeader' id='lhExp-" + listId + "'>" +
                    "<span class='labelLeft'>Warn</span>" +
                    "<input class='warnField' id='ewp-" + listId + "' title='Format: number[dwm]'>" +
                    "<span class='labelRight'>before</span>" +
                  "</span>" +
                  "<span class='labelLeft'>Order</span>" +
                  "<input class='prioField' id='eprio-" + listId + "'>" +
                  "<button class='ui-button ui-widget ui-corner-all ui-button-icon-only' id='ai-" + listId + "'>Add</button>" +
                  "<button class='ui-button ui-widget ui-corner-all ui-button-icon-only' id='del-" + listId + "'>Delete</button>" +
                  "<button class='ui-button ui-widget ui-corner-all ui-button-icon-only' id='opt-" + listId + "'>...</button>" +
                "</span>" +
                "<span class='listOptions' id='listOpts-" + listId + "' hidden>" +
                  "<span class='labelLeft'>Show as</span>" +
                  "<select id='loShow-" + listId + "'>" + 
                    "<option value='front'>front page</option>" + 
                    "<option value='tab'>separate tab</option>" + 
                  "</select>" + 
                  "<input class='listOptionCheck' type='checkbox' checked='checked' id='loExp-" + listId + "'>Show expiration</input>" + 
                  "<input class='listOptionCheck' type='checkbox' checked='checked' id='loPrio-" + listId + "'>Show priority</input>" + 
                  "<input class='listOptionCheck' type='checkbox' checked='checked' id='loStatus-" + listId + "'>Show status</input>" + 
                "</span>" +
                "<ul class='items' id='it-" + listId + "'></ul>";

            if( optShow == 'tab') {
              $( "<li id='" + listId + "'>" + 
                    "<a href='#tab-" + listId + "'>" + 
                      "<span class='listTabHeader' id='lth-" + listId + "'>" + listName +
                      "</span>" + 
                    "</a>" + 
                  "</li>").appendTo( "#tabheader");
              $("<div id='tab-" + listId + "'>" +
                listHtml +
                "</ul>").appendTo( '#tabs');
            } else {
              $( "<li class='listEntry' id='" + listId + "'>" +
                 listHtml +
                 "</li>"
              ).appendTo( "#lists");
            }
            $( '#eprio-' + listId).spinner( {
                  min:0,
                });
            $( '#ai-' + listId).button({icon: 'ui-icon-plus'});
            $( '#del-' + listId).button({icon: 'ui-icon-minus'});
            $( '#opt-' + listId).button({icon: 'ui-icon-triangle-1-e'});
            $( '#eln-' + listId).val( listName);
            $( '#ewp-' + listId).val( warning_period);
            $( '#eprio-' + listId).val( listPrio);
            setOrderFromPrio( listId, listPrio);
            $( '#loShow-' + listId).val( optShow);
            $( '#loExp-' + listId).prop( 'checked', optExp);
            $( '#loPrio-' + listId).prop( 'checked', optPrio);
            $( '#loStatus-' + listId).prop( 'checked', optStatus);
            <!-- Make properties editable -->
            linkInputDirect( 'list/' + listId, 'name',  'eln-' + listId, refreshLists);
            linkInputDirect( 'list/' + listId, 'priority',  'eprio-' + listId, function(value) {setOrderFromPrio(listId,value);}, 'spinchange');
            linkInputDirect( 'list/' + listId, 'warning_period', 'ewp-' + listId);
            linkInputDirect( 'list/' + listId, 'optShow', 'loShow-' + listId);
            linkCheckboxDirect( 'list/' + listId, 'optExp', 'loExp-' + listId);
            linkCheckboxDirect( 'list/' + listId, 'optPrio', 'loPrio-' + listId);
            linkCheckboxDirect( 'list/' + listId, 'optStatus', 'loStatus-' + listId);
            <!-- Delete list button -->
            $( '#del-' + listId).click(function() {
              if( confirm( "Delete list?")) {
                $.ajax({ url: '/list/' + listId, type: "DELETE"}).done(function(json) {
                  if( json === true) {
                    refreshLists();
                  } else {
                    alert( "Only empty lists can be deleted.")
                  }
                });
              }
            });
            <!-- Connect list options button -->
            connectShowHideButton( 'opt', 'listOpts', listId, true);
            const warningMs = computeMsOfPeriod(warning_period);
            const now=Date.now();
            const warningExpires = now + warningMs;
            hideOptionalSpan( 'lhExp', listId, optExp);
            <!-- Populate the list items -->
            $.ajax({ url: "/items/"+ listId, type: "GET", dataType:"json"}).done(function(items) {
              listDom = $( "it-" + listId).empty();
              $.each(items,function(itemInd, itemId) {
                let uId=listId+'-'+itemId;
                <!-- Create the item as a dom list item -->
                $( "<li class='itemEntry' id='" + uId + "'>"+
                     "<span class='itemHeader' id='" + uId + "'>" +
                      "<button class='ui-button ui-widget ui-corner-all ui-button-icon-only' id='showDesc-" + uId + "'>Show Description</button>" +
                       "<input class='itemInputField' id='eis-" + uId + "'>" +
                       "<span class='optHeader' id='ihExp-" + uId + "'>" +
                         "<span class='labelLeft'>Expires</span>" +
                         "<input type='text' class='itemDateField' id='eexp-" + uId + "'>" +
                       "</span>" +
                       "<span class='optHeader' id='ihPrio-" + uId + "'>" +
                         "<span class='labelLeft'>Priority</span>" +
                         "<input class='itemPrioField' id='eprio-" + uId + "'>" +
                       "</span>" +
                       "<span class='optHeader' id='ihStatus-" + uId + "'>" +
                         "<span class='labelLeft'>Status</span>" +
                         "<select class='itemStatusField' id='estatus-" + uId + "'>" +
                           "<option></option>" +
                           "<option>To Do</option>" +
                           "<option>In Work</option>" +
                           "<option>Done</option>" +
                           "<option>Blocked</option>" +
                         "</select>" +
                       "</span>" +
                       "<span class='labelLeft'></span>" +
                       "<button class='ui-button ui-widget ui-corner-all ui-button-icon-only' id='del-" + uId + "'>Delete</button>" +
                     "</span>" +
                     "<textarea class='itemdesc' rows=1 id='edesc-" + uId + "'></textarea>" +
                   "</li>").appendTo( "#it-" + listId);
                $( '#eexp-'+ uId).datepicker({ dateFormat: 'yy-mm-dd'});
                $( '#eprio-' + uId).spinner( {
                  min:0,
                });
                $( '#del-' + uId).button({icon:'ui-icon-minus'});
                $( '#showDesc-' + uId).button({icon:'ui-icon-triangle-1-n'});
                hideOptionalSpan( 'ihExp', uId, optExp);
                hideOptionalSpan( 'ihPrio', uId, optPrio);
                hideOptionalSpan( 'ihStatus', uId, optStatus);
                <!-- Populate the item -->
                $.ajax({ url: "/item/"+ listId+ "/" + itemId, type: "GET", dataType:"json"}).done(function(itemProp) {
                  const subjStr = itemProp['subject'];
                  $( '#eis-' + uId).val( subjStr);
                  const expStr=itemProp['expires'];
                  $( '#eexp-' + uId).val( expStr);
                  const statStr=itemProp['status'];
                  $( '#estatus-' + uId).val( statStr);
                  const descStr = itemProp['details'] || "";
                  var lines=0;
                  try {
                    lines = descStr.match(/\n/g).length;
                  }
                  catch (err)
                  {
                    <!-- Do nothing intentionally -->
                  }
                  if( descStr == "") {
                    <!-- Empty descriptions are hidden -->
                    $('#edesc-' + uId).attr('hidden',"");
                    $('#showDesc-' + uId).button( {icon: 'ui-icon-triangle-1-e'});
                  }
                  $( '#edesc-' + uId).val( descStr).attr('rows', lines + 1);
                  var prio=itemProp['priority'];
                  $( '#eprio-' + uId).val( prio);
                  setOrderFromPrio( uId, prio);
                  <!-- If now is within the warning period, add a simple item to the warning list. -->
                  const expires = new Date(expStr).valueOf();
                  if (expires < warningExpires) {
                    var timePref;
                    var timeClass;
                    if( now < expires)
                    {
                      timePref = formatTimeLeft( expires, now, " left");
                      timeClass = 'soonTimeComing';
                    }
                    else
                    {
                      timePref = formatTimeLeft( now, expires, " overdue");
                      timeClass = 'soonTimeOverdue';
                    }
                    $( "<li class='soonEntry'>" + 
                      "<div class='soonTimePref " + timeClass + "'><span class='soonTimePrefInner'>" + timePref +  "</span></div> " +
                        "<div class='soonEntryInfo'>" +
                          "<div class='soonEntrySubj'>" + 
                            "<span class='soonEntryListName'>" + $( '#eln-' + listId).val() + "</span>" + ":&nbsp;" +
                            "<span class='soonEntrySubjTxt'>" + subjStr + "</span> " +
                          "</div>" +
                          "<pre class='soonEntryDescBox'<><span class='soonEntryDesc'>" + descStr + "<span></pre>" +
                        "</div>" +
                      "</li>").appendTo( '#soon');
                  }
                });
                <!-- Link the edit buttons -->
                linkInputDirect( 'item/' + listId + '/' + itemId, 'subject', 'eis-' + uId);
                linkInputDirect( 'item/' + listId + '/' + itemId, 'expires', 'eexp-' + uId);
                linkInputDirect( 'item/' + listId + '/' + itemId, 'priority', 'eprio-' + uId, function(value) {setOrderFromPrio(uId,value);}, 'spinchange');
                linkInputDirect( 'item/' + listId + '/' + itemId, 'status',  'estatus-' + uId);
                linkInputDirect( 'item/' + listId + '/' + itemId, 'details', 'edesc-' + uId);
                connectShowHideButton( 'showDesc', 'edesc', uId);
                <!-- Delete item button -->
                $( '#del-' + uId).click(function() {
                  if( confirm( "Delete item?")) {
                    $.ajax({ url: '/item/' + listId + '/' + itemId, type: "DELETE"}).done(function(json) {
                      refreshLists();
                    });
                  }
                });
              });
            });
            <!-- Handle add items clicks -->
            $( "#ai-" + listId).click(function() {
              $.ajax({ url: "/items/" + listId, type: "POST"}).done(function(items) {
                document.reload();
              });
            });
          });

          $('#tabheader').append( "<li id='thi-other' class='thiLast'><a href='#tab-other'>Other</a></li>");
          $('#tabs').append(
            "<div id='tab-other'>" +
              "<button id='addList' class='ui-button ui-widget ui-corner-all'>Add List</button>" +
            "</div>");
          $('#tabs').tabs();

          $( "#addList").button({icon: "ui-icon-plus"}).click(function() {
            $.ajax({ url: "/lists", type: "POST", dataType:"json"}).done(function(items) {
              refreshLists();
            });
          });
        })
      }

      // Update the sync status
      function checkStatus()
      {
        $.ajax({ url: "/status", type: "GET", dataType:"json"}).done(function(stati) {
          console.log( stati);
          $( "#syncStatus").html( "<img src='images/sync/" + stati["sync"] + ".png'>");
          window.setTimeout( checkStatus, 10000);
        });
      }

      // Load the initial list
      $( document ).ready(function() {
        $( '#tabs').tabs();
        refreshLists();
        // Start the timer to show the sync status
        checkStatus();
      });
    </script>
    <span class='topBar'>
      <ul class='soon' id='soon'>
      </ul>
      <span class='syncStatus' id='syncStatus'>SYNC</span>
    </span>
    <div id='tabs'>
    </div>
  </body>
</html>
