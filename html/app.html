<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MultiList App</title>
    <style>
      table {
        white-space: nowrap;
        width: 100%;
      }

      td {
        max-width: 0;
        vertical-align: middle;
      }

      td.fit {
        width: 0;
        min-width: fit-content;
      }

      .button {
         background: #dddddd;
         border-left-color: #eeeeee;
         border-top-color: #eeeeee;
         border-right-color: #cccccc;
         border-bottom-color: #cccccc;
         border-width: 1px;
         border-style:solid;
         margin: 5px;
      }
      .button:hover {
         background: #ddddee;
         border-left-color: #eeeeee;
         border-top-color: #eeeeee;
         border-right-color: #cccccc;
         border-bottom-color: #cccccc;
         border-width: 2px;
         border-style:solid;
         margin: 4px;
      }
      .button:active {
         border-left-color: #cccccc;
         border-top-color: #cccccc;
         border-right-color: #eeeeee;
         border-bottom-color: #eeeeee;
      }
      .delBtn {
      }
      .delBtn::after {
        content:"\274c";
      }
      .addBtn {
      }
      .addBtn::after {
        content:"\2795";
      }
      .label {
         display: inline-block;
      }
      .field {
         background: #eeeeee;
         border-color: #eeeeee;
         min-width: 1em;
         min-height: 1em;
         display: inline-block;
      }
      .field:hover {
         background: #ffffff;
         border-left-color: #cccccc;
         border-top-color: #cccccc;
         border-right-color: #eeeeee;
         border-bottom-color: #eeeeee;
      }
      .wide {
        width:100%;
      }
      .inputField {
        min-width:3em;
        width:100%;
      }

      .lists {
        list-style-position:inside;
        padding:0px;
        margin:0px;
      }
      .listEntry {
        border-width:1px;
        margin: 4px;
        background:#eeeeff;
        order:1000000;
      }
      .listEntry::marker {
        content:none;
      }

      .soon {
        padding:5px;
        margin:0;
      }
      .soonEntry {
        background:#ffcccc;
        margin:1px;
        order:1000000;
      }
      .soonEntry::marker {
        content:none;
      }
      .items {
        display:flex;
        flex-direction:column;
        padding:5px;
      }
      .itemEntry {
        border-top-style:solid;
          border-width: 1px;
      }
      .itemEntry::marker {
        content:none;
      }
      .editField {
         background: #ffffff;
         border-left-color: #cccccc;
         border-top-color: #cccccc;
         border-right-color: #eeeeee;
         border-bottom-color: #eeeeee;
         border-width: 1px;
         border-style:solid;
         margin: 5px;
         resize:horizontal;
         overflow:hidden;
         display:inline-block;
      }
      .hidden {
        display:none;
      }
    </style>
  </head>
  <body>
    <script src="jquery.js"></script>
    <script>
      <!-- Compute milliseconds from a simplified ISO period string -->
      function computeMsOfPeriod(periodString) {
        const periodRegex = /^(\d+)([dwm])$/i;
        const periodMatch = periodRegex.exec(periodString);
        if( periodMatch !== null) {
          var days = parseInt(periodMatch[1]);
          if (periodMatch[2].toLowerCase() == 'w') {
            days = days * 7;
          } else if( periodMatch[2].toLowerCase() == 'm') {
            days = days * 30;
          }
          return days * 24 * 3600 * 1000;
        } else {
          return undefined;
        }
      }
      <!-- set the order of an list item using flex -->
      function setOrderFromPrio( listId, prio)
      {
        var s=undefined;
        if( !isNaN(prio))
        {
          // prio is a number. Set as flex-order.
          s='order:'+prio+';';
        }
        $( '#'+ listId).attr('style',s);
      }
      <!-- Function to make display items editable -->
      function linkEditBtn( suffix, varName, fieldId, btnId, callback) {
        $( '#' + btnId).click( function() {
          if( $( '#' + fieldId).attr('contenteditable') === undefined) {
            $( '#' + fieldId).attr('contenteditable','true').addClass('editField');
          } else {
            var text=$( '#' + fieldId).removeAttr('contenteditable').removeClass('editField').text();
            data = {};
            data[varName]=text;
            if( callback !== undefined) {
              callback( text);
            }
            $.ajax({ url: "/" + suffix, type: "PUT", contentType:"application/json", data:JSON.stringify(data)}).done(function(json) { });
          }
        })
      }
      <!-- Function to make display items editable -->
      function linkInput( suffix, varName, fieldId, inputId, callback) {
        $( '#' + fieldId).click( function() {
          $( '#' + fieldId).addClass("hidden");
          $( '#' + inputId).removeClass("hidden").on( "change", function() {
            var text=$( '#' + inputId).addClass("hidden").val();
            $( '#' + fieldId).removeClass("hidden").text(text);
            data = {};
            data[varName]=text;
            if( callback !== undefined) {
              callback( text);
            }
            $.ajax({ url: "/" + suffix, type: "PUT", contentType:"application/json", data:JSON.stringify(data)}).done(function(json) { });
          }).on( "blur", function() {
            var text=$( '#' + fieldId).removeClass("hidden").text();
            $( '#' + inputId).addClass("hidden").val(text);
          });
        });
      }
      <!-- Refresh all lists -->
      function refreshLists( ) {
        $.ajax({ url: "/lists", type: "GET", dataType:"json"}).done(function(json) {
          $( "#lists").empty();
          $.each( json, function(index,listId) {
            <!-- Create the list as a DOM list item -->
            $( "<li class='listEntry' id='" + listId + "'>" +
                  "<table>" +
                    "<tr class='listHeader' id='" + listId + "'>" +
                      "<td>"+
                        "<span class='field' id='ln-" + listId + "'></span>" +
                        "<input class='hidden inputField' id='eln-" + listId + "'>" +
                      "</td>"+
                      "<td class='fit'>"+
                        "<span class='label'>Warn&nbsp;</span>" +
                        "<span class='field' id='wp-" + listId + "'></span>" +
                        "<input class='hidden inputField' id='ewp-" + listId + "'>" +
                        "<span class='label'>&nbsp;before</span>" +
                      "</td>"+
                      "<td class='fit'>"+
                        "<span class='label'>Order&nbsp;</span>" +
                        "<span class='field' id='prio-" + listId + "'></span>" +
                        "<input class='hidden inputField' id='eprio-" + listId + "'>" +
                      "</td>"+
                      "<td class='fit'>"+
                        "<span class='button addBtn' id='ai-" + listId + "'></span>" +
                        "<span class='button delBtn' id='del-" + listId + "'></span>" +
                      "</td>"+
                    "</tr>" +
                    "<tr><td colspan=4>" +
                      "<ul class='items' id='it-" + listId + "'></ul>" +
                    "</td></tr>" +
                  "</table>" +
               "</li>"
            ).appendTo( "#lists");
            var warning_period = '';
            <!-- Populate the properties. Do it synchronously to simplify getting the warning period.-->
            $.ajax({ url: '/list/' + listId, type: "GET", dataType:"json", async:false}).done(function(json) {
              $( '#ln-' + listId).text( json['name']);
              $( '#eln-' + listId).val( json['name']);
              warning_period = json['warning_period'];
              $( '#wp-' + listId).text( warning_period);
              $( '#ewp-' + listId).val( warning_period);
              let prio=json['priority'];
              $( '#prio-' + listId).text( prio);
              $( '#eprio-' + listId).val( prio);
              setOrderFromPrio( listId, prio);
            });
            <!-- Make properties editable -->
            linkInput( 'list/' + listId, 'name', 'ln-' + listId, 'eln-' + listId);
            linkInput( 'list/' + listId, 'priority', 'prio-' + listId, 'eprio-' + listId, function(value) {setOrderFromPrio(listId,value);});
            linkInput( 'list/' + listId, 'warning_period', 'wp-' + listId, 'ewp-' + listId);
            <!-- Delete list button -->
            $( '#del-' + listId).click(function() {
              if( confirm( "Delete list?")) {
                $.ajax({ url: '/list/' + listId, type: "DELETE"}).done(function(json) {
                  if( json === true) {
                    refreshLists();
                  } else {
                    alert( "Only empty lists can be deleted.")
                  }
                });
              }
            });
            const warningMs = computeMsOfPeriod(warning_period);
            const now=Date.now();
            const warningExpires = now + warningMs;
            <!-- Populate the list items -->
            $.ajax({ url: "/items/"+ listId, type: "GET", dataType:"json"}).done(function(items) {
              listDom = $( "it-" + listId).empty();
              $.each(items,function(itemInd, itemId) {
                let uId=listId+'-'+itemId;
                <!-- Create the item as a dom list item -->
                $( "<li class='itemEntry' id='" + uId + "'>"+
                    "<table>" +
                      "<tr class='itemHeader' id='" + uId + "'>" +
                        "<td>" +
                          "<span class='field' id='is-" + uId + "'></span>" +
                          "<input class='hidden inputField' id='eis-" + uId + "'>" +
                        "</td>" +
                        "<td class='fit'>" +
                          "<span class='label'>Expires&nbsp;</span>" +
                          "<span class='field' id='exp-" + uId + "'></span>" +
                          "<input class='hidden inputField' id='eexp-" + uId + "'>" +
                        "</td>" +
                        "<td class='fit'>" +
                          "<span class='label'>Priority&nbsp;</span>" +
                          "<span class='field' id='prio-" + uId + "'></span>" +
                          "<input class='hidden inputField' id='eprio-" + uId + "'>" +
                        "</td>" +
                        "<td class='fit'>" +
                          "<span class='label'>Status&nbsp;</span>" +
                          "<span class='field' id='status-" + uId + "'></span>" +
                          "<input class='hidden inputField' id='estatus-" + uId + "'>" +
                        "</td>" +
                        "<td class='fit'>" +
                          "<span class='button delBtn' id='del-" + uId + "'></span>" +
                        "</td>" +
                      "</tr>" +
                      "<tr><td colspan=5>" +
                        "<span class='field wide' id='desc-" + uId + "'></span>" +
                        "<input class='hidden inputField' id='edesc-" + uId + "'>" +
                      "</tr>" +
                    "</table>" +
                   "</li>").appendTo( "#it-" + listId);
                <!-- Populate the item -->
                $.ajax({ url: "/item/"+ listId+ "/" + itemId, type: "GET", dataType:"json"}).done(function(itemProp) {
                  console.log(itemProp);
                  const subjStr = itemProp['subject'];
                  $( '#is-' + uId).text( subjStr);
                  $( '#eis-' + uId).val( subjStr);
                  const expStr=itemProp['expires'];
                  $( '#exp-' + uId).text( expStr);
                  $( '#eexp-' + uId).val( expStr);
                  const statStr=itemProp['status'];
                  $( '#status-' + uId).text( statStr);
                  $( '#estatus-' + uId).val( statStr);
                  const descStr = itemProp['details'];
                  $( '#desc-' + uId).text( descStr);
                  $( '#edesc-' + uId).val( descStr);
                  var prio=itemProp['priority'];
                  $( '#prio-' + uId).text( prio);
                  $( '#eprio-' + uId).val( prio);
                  setOrderFromPrio( uId, prio);
                  <!-- If now is within the warning period, add a simple item to the warning list. -->
                  const expires = new Date(expStr).valueOf();
                  if (expires < warningExpires) {
                    $( "<li class='soonEntry'>" + 
                         "<div class='soonEntrySubj'>" + 
                           "<span class='soonEntrySubjTxt'>" + subjStr + "</span>" +
                           " expires soon." + 
                         "</div>" +
                         "<div class='soonEntryDesc'>" + descStr +
                         "</div>" +
                       "</li>").appendTo( '#soon');
                  }
                });
                <!-- Link the edit buttons -->
                linkInput( 'item/' + listId + '/' + itemId, 'subject', 'is-' + uId, 'eis-' + uId);
                linkInput( 'item/' + listId + '/' + itemId, 'expires', 'exp-' + uId, 'eexp-' + uId);
                linkInput( 'item/' + listId + '/' + itemId, 'priority', 'prio-' + uId, 'eprio-' + uId, function(value) {setOrderFromPrio(uId,value);});
                linkInput( 'item/' + listId + '/' + itemId, 'status', 'status-' + uId, 'estatus-' + uId);
                linkInput( 'item/' + listId + '/' + itemId, 'details', 'desc-' + uId, 'edesc-' + uId);
                <!-- Delete item button -->
                $( '#del-' + uId).click(function() {
                  if( confirm( "Delete item?")) {
                    $.ajax({ url: '/item/' + listId + '/' + itemId, type: "DELETE"}).done(function(json) {
                      refreshLists();
                    });
                  }
                });
              });
            });
            <!-- Handle add items clicks -->
            $( "#ai-" + listId).click(function() {
              $.ajax({ url: "/items/" + listId, type: "POST"}).done(function(items) {
                refreshLists();
              });
            });
          });
        })
      }

      <!-- Load the initial list -->
      $( document ).ready(function() {
        refreshLists();
        $( "#addList").click(function() {
          $.ajax({ url: "/lists", type: "POST", dataType:"json"}).done(function(items) {
            refreshLists();
          });
        });
      });
    </script>
    <ul class='soon' id='soon'>
    </ul>
    <span id="addList" class="button addBtn"></span>
    <ul class='lists' id="lists">
    </ul>
  </body>
</html>
